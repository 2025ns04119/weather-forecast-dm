# ==============================================================
# Feature registry (custom feature store metadata) - weather project
# One entry per feature: what it is, where it comes from, how it is computed,
# and in which feature versions it exists.
#   Code that computes them : pipeline/feature_engineering/build_features.py  (build_features)
#   Where they are stored   : Neon  features.weather_features  (gold layer)
#   Retrieval API           : pipeline/feature_store/store.py  (FeatureStore)
# The registry is versioned with Git; `python -m pipeline.feature_store.store --sync`
# copies it into the table features.feature_registry.
# ==============================================================
entity:
  name: location_hour
  keys: [location, ts]
  description: One row per location per UTC hour
store:
  offline_table: features.weather_features
  version_column: feature_version
  current_version: v3
  source_table: clean.weather_hourly
  freshness_limit_hours: 6

versions:
  v1: Local clock hour (IST), temperature lags/rolling means, current conditions - Bengaluru only
  v2: Solar hour instead of clock hour + latitude - one global model for any city
  v3: Adds weather memory (24 h lags of humidity/cloud/wind), pressure tendency and recent rain - multi-target model

features:
  - name: hour
    dtype: int
    source: clean.weather_hourly.ts + clean.locations.longitude
    transformation: floor((UTC hour + longitude / 15) mod 24)  - local solar hour (v1 used IST clock hour)
    description: Time of day relative to the sun; drives the daily temperature cycle
    versions: [v1, v2, v3]
  - name: month
    dtype: int
    source: clean.weather_hourly.ts
    transformation: month(ts)
    description: Season
    versions: [v1, v2, v3]
  - name: latitude
    dtype: float
    source: clean.locations.latitude
    transformation: copied from the location dimension
    description: Hemisphere and climate context for the global model
    versions: [v2, v3]
  - name: temp_lag_1h
    dtype: float
    source: clean.weather_hourly.temperature_2m
    transformation: temperature 1 hour earlier (shift 1)
    description: Most recent temperature
    versions: [v1, v2, v3]
  - name: temp_lag_3h
    dtype: float
    source: clean.weather_hourly.temperature_2m
    transformation: temperature 3 hours earlier (shift 3)
    description: Short-term temperature history
    versions: [v1, v2, v3]
  - name: temp_lag_24h
    dtype: float
    source: clean.weather_hourly.temperature_2m
    transformation: temperature 24 hours earlier (shift 24)
    description: Same hour yesterday
    versions: [v1, v2, v3]
  - name: temp_roll_mean_6h
    dtype: float
    source: clean.weather_hourly.temperature_2m
    transformation: mean of the last 6 hours (needs all 6)
    description: Short-term temperature trend
    versions: [v1, v2, v3]
  - name: temp_roll_mean_24h
    dtype: float
    source: clean.weather_hourly.temperature_2m
    transformation: mean of the last 24 hours (needs all 24)
    description: Daily mean temperature level
    versions: [v1, v2, v3]
  - name: humidity
    dtype: float
    source: clean.weather_hourly.relative_humidity_2m
    transformation: current value (%)
    description: Current relative humidity
    versions: [v1, v2, v3]
  - name: pressure
    dtype: float
    source: clean.weather_hourly.pressure_msl
    transformation: current value (hPa)
    description: Current sea-level pressure
    versions: [v1, v2, v3]
  - name: wind_speed
    dtype: float
    source: clean.weather_hourly.wind_speed_10m
    transformation: current value (km/h)
    description: Current wind speed
    versions: [v1, v2, v3]
  - name: cloud_cover
    dtype: float
    source: clean.weather_hourly.cloud_cover
    transformation: current value (%)
    description: Current cloud cover
    versions: [v1, v2, v3]
  - name: humidity_lag_24h
    dtype: float
    source: clean.weather_hourly.relative_humidity_2m
    transformation: humidity 24 hours earlier (shift 24)
    description: Weather memory - humidity yesterday
    versions: [v3]
  - name: cloud_lag_24h
    dtype: float
    source: clean.weather_hourly.cloud_cover
    transformation: cloud cover 24 hours earlier (shift 24)
    description: Weather memory - cloud cover yesterday
    versions: [v3]
  - name: wind_lag_24h
    dtype: float
    source: clean.weather_hourly.wind_speed_10m
    transformation: wind speed 24 hours earlier (shift 24)
    description: Weather memory - wind yesterday
    versions: [v3]
  - name: pressure_change_3h
    dtype: float
    source: clean.weather_hourly.pressure_msl
    transformation: pressure now minus pressure 3 hours earlier
    description: Pressure tendency (falling pressure often means rain)
    versions: [v3]
  - name: rain_6h
    dtype: float
    source: clean.weather_hourly.precipitation
    transformation: sum of the last 6 hours (missing treated as 0)
    description: Recent rainfall (mm)
    versions: [v3]
  - name: rain_24h
    dtype: float
    source: clean.weather_hourly.precipitation
    transformation: sum of the last 24 hours (missing treated as 0)
    description: Rainfall over the last day (mm)
    versions: [v3]

common_rules:
  - Gaps of up to 3 hours are filled by time interpolation before features are computed
  - Rows with any missing feature are dropped (no guessed values)
  - Only past and current values are used, so no feature leaks future information
