# Weather data pipeline - runs in the cloud on GitHub Actions
# GitHub Actions = scheduler + runner; Prefect Cloud = orchestrator UI (pipeline/orchestration/flow.py):
# ingest (city CSV + Open-Meteo API) -> validate/clean -> features -> feature store -> [train] -> 7-day forecast
name: Hourly weather pipeline

on:
  schedule:
    - cron: "17 * * * *"      # every hour at minute 17 (UTC): data + forecast
  workflow_dispatch:           # "Run workflow" button
    inputs:
      train:
        description: "Retrain the model (and build the model performance report)"
        type: boolean
        default: false
      report:
        description: "Build the data quality and EDA reports"
        type: boolean
        default: false

concurrency:                   # never run two pipelines at the same time
  group: hourly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      LAT: "12.97"
      LON: "77.59"
      LOCATION: "Bengaluru"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (same as the training machine)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run the Prefect flow
        run: >
          python -m pipeline.orchestration.flow
          ${{ inputs.train && '--train' || '' }}
          ${{ inputs.report && '--report' || '' }}

      - name: Model performance report (after training)
        if: ${{ inputs.train }}
        run: python -m pipeline.model_evaluation.performance_report

      - name: Keep logs, reports and raw data-lake files from this run
        if: always()                     # also after a failure, for the audit trail
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}-logs-reports-raw
          path: |
            logs/
            reports/
            data/raw/
          retention-days: 30
          if-no-files-found: ignore
