# Hourly data + forecast pipeline (runs in the cloud on GitHub Actions)
# ingest (Open-Meteo) -> validate/clean -> features -> 7-day forecast  ==> Neon
name: Hourly weather pipeline

on:
  schedule:
    - cron: "17 * * * *"      # every hour at minute 17 (UTC)
  workflow_dispatch:           # "Run workflow" button for manual runs

concurrency:                   # never run two pipelines at the same time
  group: hourly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      LAT: "12.97"
      LON: "77.59"
      LOCATION: "Bengaluru"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (same as the training machine)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: 1. Ingest live weather (bronze)
        run: python -m ingestion.fetch_weather --mode live

      - name: 2. Validate and clean (silver)
        run: python -m validation.clean_weather

      - name: 3. Build features (gold)
        run: python -m features.build_features

      - name: 4. 7-day forecast
        run: python -m inference.predict
